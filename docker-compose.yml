services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
