[project]
name = "enterpriseagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jmortizgarcia", email = "jmortizgarcia@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "chromadb>=1.5.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.0",
    "langchain-core>=1.5.2",
    "langgraph>=1.2.10",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.52.0",
]

[project.scripts]
enterpriseagent = "enterpriseagent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]
